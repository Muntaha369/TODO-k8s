version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: todo-mongo
    restart: always
    environment:
           MONGO_INITDB_ROOT_USERNAME: mongoadmin
           MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  backend:
    build: ./server
    container_name: todo-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongoadmin:root@mongodb:27017/mydb?authSource=admin
    depends_on:
      - mongodb
    networks:
      - app-network
  
  frontend:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api/todos # Always remember in next env should be passed at build stage if its not pass at the build stage it will ignore the env expossed after the build look once docker file to get the idea
    container_name: todo-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
