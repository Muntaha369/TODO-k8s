version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: todo-mongo
    restart: always
    environment:
           MONGO_INITDB_ROOT_USERNAME: mongoadmin
           MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  backend:
    build: ./server
    container_name: todo-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongoadmin:root@mongodb:27017/mydb?authSource=admin
    depends_on:
      - mongodb
    networks:
      - app-network
  
  frontend:
    build: ./client
    container_name: todo-frontend
    restart: always
    ports:
      - "3000:3000"
    command: npm run dev
    environment:
      NODE_ENV: development #Not even necessary to pass
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
