apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: todo-image-updater
  namespace: argocd
spec:
  appName: todo                          # your ArgoCD app name
  appNamespace: argocd
  images:
    - image: muntaha69/todo-client
      alias: client
      updateStrategy:
        type: SemVer
      writeBack:
        method: git
        git:
          repoURL: https://github.com/Muntaha369/TODO-k8s.git
          branch: main
          credentials:
            secret:
              name: argocd-image-updater-git-creds
              namespace: argocd
    - image: muntaha69/todo-server
      alias: server
      updateStrategy:
        type: SemVer
      writeBack:
        method: git
        git:
          repoURL: https://github.com/Muntaha369/TODO-k8s.git
          branch: main
          credentials:
            secret:
              name: argocd-image-updater-git-creds
              namespace: argocd